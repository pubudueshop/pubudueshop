        // Handles old long slugs (>60 chars) redirecting to new short slugs
        // Also handles old ?product= query param URLs

        function createSEOSlug(name) {
            if (!name) return "";
            let slug = name
                .toLowerCase()
                .replace(/[^\w ]+/g, '')
                .replace(/ +/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
            // Cut at word boundary (last dash before 60 chars) to match seo-gen.js
            if (slug.length > 60) {
                const cut = slug.substring(0, 60);
                const lastDash = cut.lastIndexOf('-');
                slug = lastDash > 30 ? cut.substring(0, lastDash) : cut;
            }
            return slug.replace(/-$/g, '');
        }

        const cleanPath = path.replace(/\/+$/, ''); // Remove trailing slash for comparison

            // END_REDIRECT_MAP

            if (redirectMap[cleanPath]) {
                window.location.replace(redirectMap[cleanPath]);
            }
            // Case 0.3: Slug-only fallback matching (to handle category shifts)
            else if (cleanPath.split('/').filter(Boolean).length >= 1) {
                const parts = cleanPath.split('/').filter(Boolean);
                const lastSegment = parts[parts.length - 1];
                let foundUrl = null;
                
                for (const [oldUrl, newUrl] of Object.entries(redirectMap)) {
                    const oldSlug = oldUrl.replace(/\/+$/, '').split('/').pop();
                    const newSlug = newUrl.replace(/\/+$/, '').split('/').pop();
                    if (oldSlug === lastSegment || newSlug === lastSegment) {
                        foundUrl = newUrl;
                        break;
                    }
                }
                
                if (foundUrl) {
                    window.location.replace(foundUrl);
                }
                // Case 1: Old ?product=ID query param → redirect to home (script.js handles it)
                else if (queryId) {
                    window.location.replace('/?product=' + queryId);
                }
                // Case 2: Old /products/slug-ID/ pattern
                else if (path.match(/\/products\/.*-([0-9]+)\/?$/)) {
                    const m = path.match(/\/products\/.*-([0-9]+)\/?$/);
                    window.location.replace('/?product=' + m[1]);
                }
                // Case 3: Old long slug → try to find new short slug
                else if (path.split('/').filter(Boolean).length >= 2) {
                    const parts = path.split('/').filter(Boolean);
                    const lastSegment = parts[parts.length - 1];
                    
                    if (lastSegment && lastSegment.length > 60) {
                        // Truncate to new short slug format using correct word-boundary logic
                        const newSlug = createSEOSlug(lastSegment);
                        parts[parts.length - 1] = newSlug;
                        const newPath = '/' + parts.join('/') + '/';
                        window.location.replace(newPath);
                    } else if (lastSegment) {
                        // Dynamic fallback for newly added items / pending SSG pages: open product modal on homepage
                        window.location.replace('/?productSlug=' + encodeURIComponent(lastSegment));
                    } else {
                        window.location.replace('/');
                    }
                }
                // Case 4: URL has query params appended (?category=...&subcategory=...&product=...)
                else if (urlParams.get('category') || urlParams.get('subcategory')) {
                    // Strip query params, keep clean path
                    window.location.replace(path.split('?')[0]);
                }
                else {
                    const parts = cleanPath.split('/').filter(Boolean);
                    const lastSegment = parts[parts.length - 1];
                    if (lastSegment && !lastSegment.endsWith('.html') && !lastSegment.endsWith('.txt') && !lastSegment.endsWith('.xml')) {
                        // Single slug path fallback
                        window.location.replace('/?productSlug=' + encodeURIComponent(lastSegment));
                    } else {
                        window.location.replace('/');
                    }
                }
            }
            else {
                window.location.replace('/');
            }
