<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | Pubudu Electronics</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }
        .loader { text-align: center; }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            width: 36px; height: 36px;
            border-radius: 50%;
            border-left-color: #2563eb;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-bottom: 1rem;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    </style>
    <script>
        // ===== SMART REDIRECT: Old URL → New Short URL =====
        // Handles old long slugs (>60 chars) redirecting to new short slugs
        // Also handles old ?product= query param URLs

        function createSEOSlug(name) {
            if (!name) return "";
            let slug = name
                .toLowerCase()
                .replace(/[^\w ]+/g, '')
                .replace(/ +/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
            // Cut at word boundary (last dash before 60 chars) to match seo-gen.js
            if (slug.length > 60) {
                const cut = slug.substring(0, 60);
                const lastDash = cut.lastIndexOf('-');
                slug = lastDash > 30 ? cut.substring(0, lastDash) : cut;
            }
            return slug.replace(/-$/g, '');
        }

        const path = window.location.pathname;
        const cleanPath = path.replace(/\/+$/, ''); // Remove trailing slash for comparison
        const urlParams = new URLSearchParams(window.location.search);
        const queryId = urlParams.get('product');

        // Case 0.1: Remove "/category" prefix automatically if URL starts with it
        if (path.startsWith('/category/')) {
            window.location.replace(path.replace(/^\/category/, ''));
        }
        // Case 0.2: Explicit redirect map for old URLs that don't match standard truncation rules
        else {
            // BEGIN_REDIRECT_MAP
            const redirectMap = {
                '/igbt/nchannel/mp50n65ed-igbt-650v-50a-to247-power-transistor-high-speed-sw': '/igbt/nchannel/mp50n65ed-igbt-650v-50a-to247-power-transistor-high-speed/',
                '/module/buck-converter/hw920-dcdc-buck-converter-adjustable-stepdown-power-supply-m': '/module/buck-converter/hw920-dcdc-buck-converter-adjustable-stepdown-power-supply/',
                '/module/buck-converter/hw920-dcdc-buck-converter-adjustable-stepdown-power-supply-module': '/module/buck-converter/hw920-dcdc-buck-converter-adjustable-stepdown-power-supply/',
                '/capacitor/polyester-film-capacitor/182j-polyester-film-capacitor-18nf-100v-radial-lead-green-capacitor': '/capacitor/polyester-film-capacitor/182j-polyester-film-capacitor-18nf-100v-radial-lead-green/',
                '/capacitor/polyester-film-capacitor/153j-polyester-film-capacitor-0015f-100v-radial-lead-green-capacitor': '/capacitor/polyester-film-capacitor/153j-polyester-film-capacitor-0015µf-100v-radial-lead-green/',
                '/capacitor/polyester-film-capacitor/223j-polyester-film-capacitor-0022f-500v-radial-lead-capacitor': '/capacitor/polyester-film-capacitor/223j-polyester-film-capacitor-0022µf-500v-radial-lead/',
                '/capacitor/polyester-film-capacitor/223k-polyester-film-capacitor-0022f-10-tolerance-radial-lead-capacitor': '/capacitor/polyester-film-capacitor/223k-polyester-film-capacitor-0022µf-10-tolerance-radial/'
            };
            // END_REDIRECT_MAP

            if (redirectMap[cleanPath]) {
                window.location.replace(redirectMap[cleanPath]);
            }
            // Case 0.3: Slug-only fallback matching (to handle category shifts)
            else if (cleanPath.split('/').filter(Boolean).length >= 1) {
                const parts = cleanPath.split('/').filter(Boolean);
                const lastSegment = parts[parts.length - 1];
                let foundUrl = null;
                
                for (const [oldUrl, newUrl] of Object.entries(redirectMap)) {
                    const oldSlug = oldUrl.replace(/\/+$/, '').split('/').pop();
                    const newSlug = newUrl.replace(/\/+$/, '').split('/').pop();
                    if (oldSlug === lastSegment || newSlug === lastSegment) {
                        foundUrl = newUrl;
                        break;
                    }
                }
                
                if (foundUrl) {
                    window.location.replace(foundUrl);
                }
                // Case 1: Old ?product=ID query param → redirect to home (script.js handles it)
                else if (queryId) {
                    window.location.replace('/?product=' + queryId);
                }
                // Case 2: Old /products/slug-ID/ pattern
                else if (path.match(/\/products\/.*-([0-9]+)\/?$/)) {
                    const m = path.match(/\/products\/.*-([0-9]+)\/?$/);
                    window.location.replace('/?product=' + m[1]);
                }
                // Case 3: Old long slug → try to find new short slug
                // Pattern: /category/subcategory/very-long-slug-here/
                else if (path.split('/').filter(Boolean).length >= 2) {
                    const parts = path.split('/').filter(Boolean);
                    
                    // If last segment is longer than 60 chars, it's an old long slug
                    const lastSegment = parts[parts.length - 1];
                    
                    if (lastSegment && lastSegment.length > 60) {
                        // Truncate to new short slug format using correct word-boundary logic
                        const newSlug = createSEOSlug(lastSegment);
                        
                        parts[parts.length - 1] = newSlug;
                        const newPath = '/' + parts.join('/') + '/';
                        
                        // Redirect to new short URL
                        window.location.replace(newPath);
                    }
                }
                // Case 4: URL has query params appended (?category=...&subcategory=...&product=...)
                else if (urlParams.get('category') || urlParams.get('subcategory')) {
                    // Strip query params, keep clean path
                    window.location.replace(path.split('?')[0]);
                }
                else {
                    // Unknown 404 - go home
                    window.location.replace('/');
                }
            }
            else {
                window.location.replace('/');
            }
        }
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Redirecting...</p>
    </div>
</body>
</html>
