<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-G Search | Experience Gravity-Free Browsing</title>
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #05070a;
            --accent-primary: #6366f1;
            --accent-secondary: #06b6d4;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            color: white;
            overflow: hidden;
            margin: 0;
            cursor: default;
        }

        .gradient-text {
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .search-container {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .search-container:focus-within {
            transform: scale(1.02);
            border-color: var(--accent-primary);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        .instruction-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--glass-border);
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Floating Animation for UI Elements */
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .float { animation: floating 4s ease-in-out infinite; }

        /* Mobile specific adjustments */
        @media (max-width: 640px) {
            .hero-title { font-size: 2.5rem; }
            .search-box { width: 90% !important; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <!-- Interaction Instructions -->
    <div id="toast" class="instruction-toast">
        <i class="fas fa-info-circle mr-2 text-indigo-400"></i>
        Tap 'I'm Feeling Lucky' to toggle Zero-G mode!
    </div>

    <!-- Main Content -->
    <main id="ui-wrapper" class="z-10 flex flex-col items-center text-center space-y-8 px-4">
        <!-- Brand -->
        <div class="space-y-2 pointer-events-none select-none">
            <h1 class="hero-title text-5xl md:text-7xl font-bold tracking-tight">
                Zero<span class="gradient-text">G</span> Search
            </h1>
            <p class="text-slate-400 text-lg md:text-xl font-light">The web, untethered from gravity.</p>
        </div>

        <!-- Search Form -->
        <div id="search-box" class="search-box w-full max-w-2xl">
            <div class="glass-card search-container rounded-2xl flex items-center p-2 mb-6 group">
                <div class="px-4 text-slate-500 group-focus-within:text-indigo-400 transition-colors">
                    <i class="fas fa-search text-xl"></i>
                </div>
                <input type="text" id="search-input" 
                    placeholder="Search the universe..." 
                    class="bg-transparent w-full py-4 text-xl outline-none placeholder:text-slate-600">
                <button id="voice-btn" class="p-4 text-slate-500 hover:text-indigo-400 transition-colors">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>

            <!-- Buttons -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <button id="search-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-xl font-semibold transition-all hover:shadow-[0_0_20px_rgba(79,70,229,0.4)] active:scale-95">
                    Search Galaxy
                </button>
                <button id="lucky-btn" class="glass-card hover:bg-white/10 px-8 py-3 rounded-xl font-semibold transition-all active:scale-95 border-none shadow-none">
                    <i class="fas fa-rocket mr-2 text-cyan-400"></i> I'm Feeling Lucky
                </button>
            </div>
        </div>

        <!-- Background Elements Info (Hidden by default) -->
        <div class="pt-20 opacity-30 text-sm font-medium tracking-widest uppercase pointer-events-none">
            Powered by Particle Physics
        </div>
    </main>

    <script>
        // --- Matter.js Physics Engine ---
        const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint, Events, World } = Matter;

        let engine, world, render, runner;
        let isZeroG = false;
        let bodies = [];

        function initPhysics() {
            engine = Engine.create();
            world = engine.world;
            world.gravity.y = 1; // Start with normal gravity

            render = Render.create({
                element: document.body,
                engine: engine,
                options: {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    wireframes: false,
                    background: 'transparent'
                }
            });

            // Add Boundaries
            const ground = Bodies.rectangle(window.innerWidth / 2, window.innerHeight + 50, window.innerWidth, 100, { isStatic: true });
            const leftWall = Bodies.rectangle(-50, window.innerHeight / 2, 100, window.innerHeight, { isStatic: true });
            const rightWall = Bodies.rectangle(window.innerWidth + 50, window.innerHeight / 2, 100, window.innerHeight, { isStatic: true });
            const ceiling = Bodies.rectangle(window.innerWidth / 2, -50, window.innerWidth, 100, { isStatic: true });
            
            Composite.add(world, [ground, leftWall, rightWall, ceiling]);

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);

            // Add floating particles
            createParticles(20);

            // Responsive Re-init
            window.addEventListener('resize', () => {
                render.canvas.width = window.innerWidth;
                render.canvas.height = window.innerHeight;
            });
        }

        function createParticles(count) {
            for (let i = 0; i < count; i++) {
                const size = Math.random() * 40 + 20;
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                
                const particle = Bodies.circle(x, y, size, {
                    friction: 0.1,
                    restitution: 0.8,
                    render: {
                        fillStyle: `hsla(${Math.random() * 360}, 70%, 50%, 0.15)`,
                        strokeStyle: 'rgba(255,255,255,0.1)',
                        lineWidth: 1
                    }
                });
                bodies.push(particle);
                Composite.add(world, particle);
            }
        }

        function toggleGravity() {
            isZeroG = !isZeroG;
            
            if (isZeroG) {
                world.gravity.y = 0;
                // Add some initial "kick"
                bodies.forEach(body => {
                    Matter.Body.applyForce(body, body.position, {
                        x: (Math.random() - 0.5) * 0.05,
                        y: (Math.random() - 0.5) * 0.05
                    });
                });
                
                // Animate UI elements floating away
                gsap.to("#ui-wrapper > div", {
                    y: "-=30",
                    rotation: "random(-2, 2)",
                    duration: 2,
                    ease: "sine.inOut",
                    stagger: 0.2
                });

                document.body.style.cursor = 'grab';
            } else {
                world.gravity.y = 1;
                gsap.to("#ui-wrapper > div", {
                    y: 0,
                    rotation: 0,
                    duration: 1,
                    ease: "bounce.out"
                });
                document.body.style.cursor = 'default';
            }
        }

        // --- Search Logic ---
        function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (query) {
                // Smooth fade out before redirect
                gsap.to("main", { opacity: 0, scale: 0.9, duration: 0.5 });
                setTimeout(() => {
                    window.location.href = `https://ichouse.lk/index.html?search=${encodeURIComponent(query)}`;
                }, 500);
            } else {
                // Fun shake animation if empty
                gsap.to("#search-box", { x: [-10, 10, -5, 5, 0], duration: 0.4 });
            }
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            initPhysics();

            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const luckyBtn = document.getElementById('lucky-btn');

            // Search Trigger
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });

            // Gravity Trigger
            luckyBtn.addEventListener('click', toggleGravity);

            // Instructions Toast
            setTimeout(() => {
                document.getElementById('toast').style.opacity = '1';
                setTimeout(() => {
                    document.getElementById('toast').style.opacity = '0';
                }, 4000);
            }, 1000);

            // Intro Animation
            gsap.from("main > div", {
                y: 50,
                opacity: 0,
                duration: 1,
                stagger: 0.2,
                ease: "power4.out"
            });
        });
    </script>
</body>
</html>
